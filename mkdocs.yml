site_name: diii-neotrellis-emulator Documentation
site_description: Browser-based emulator for Monome and NeoTrellis Lua scripts
site_author: jonwaterschoot
site_url: https://jonwaterschoot.github.io/diii-neotrellis-emulator/docs/

repo_name: "Launch Emulator"
repo_url: https://jonwaterschoot.github.io/diii-neotrellis-emulator/

docs_dir: docs

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Using the Emulator:
    - Walkthrough: walkthrough.md
    - Hardware vs. Emulator: hardware-vs-emulator.md
  - Writing Scripts:
    - Start a Script: start-a-script.md
    - Script Standard: script-standards.md
    - Colour and Monochrome: colour.md
    - Developer Guide: developer-guide.md
  - Scripts:
    - LeaveSeqr: leaveseqr.md
    - Sandman: sandman.md
    - Serpentine Sequencer: serpentine-sequencer.md
    - Serpentine Changelog: changelog.md
    - Multi-Screen Test: multi-screen-test.md
  - Project:
    - README: main-readme.md
    - To Do: todo.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  font:
    text: Manrope
    code: Roboto Mono
extra_css:
  - extra.css

plugins:
  - search
  - include-markdown

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - codehilite
  - footnotes
  - meta
  - tables